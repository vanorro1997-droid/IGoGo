services:
  postgres:
    # Pin the multi-platform index; Docker selects the native Linux architecture.
    # Startup, registry overrides and image updates: docs/docker.md.
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:15.20-alpine3.23@sha256:83bdbdd781076b1543709883a93d995b53e682b078ea30e3cea012856732d1e5}
    container_name: igogo-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-igogo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${GO_IMAGE:-public.ecr.aws/docker/library/golang:1.26.5-alpine3.23@sha256:622e56dbc11a8cfe87cafa2331e9a201877271cbff918af53d3be315f3da88cc}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-public.ecr.aws/docker/library/alpine:3.23.8@sha256:469c9ea410b9215eaee7976ba6c0639039b444be8e5d638f7abbada189971eb2}
    container_name: igogo-app
    ports:
      - "${HTTP_PORT:-${PORT:-8081}}:${HTTP_PORT:-${PORT:-8081}}"
    environment:
      HTTP_PORT: ${HTTP_PORT:-${PORT:-8081}}
      FRONTEND_DIR: ${FRONTEND_DIR:-frontend}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-mock}
      TRANSPORT_PROVIDER: ${TRANSPORT_PROVIDER:-mock}
      YANDEX_RASP_API_KEY: ${YANDEX_RASP_API_KEY:-${YANDEX_API_KEY:-}}
      DB_ENABLED: ${DB_ENABLED:-true}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-igogo}
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-}
      CLOUDFLARE_SYSTEM_PROMPT: ${CLOUDFLARE_SYSTEM_PROMPT:-}
      CLOUDFLARE_PROXY: ${CLOUDFLARE_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
